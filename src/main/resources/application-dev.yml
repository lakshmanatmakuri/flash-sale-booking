logging:
  level:
    com.example.booking: DEBUG
    org.flywaydb: INFO

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-this-is-at-least-32-bytes}
  payment:
    webhook:
      secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  kafka:
    consumer-enabled: true     # tests drive consumer logic directly; keeps assertions deterministic