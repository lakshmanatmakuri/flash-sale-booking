
spring:
  application:
    name: booking

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DATABASE_USERNAME:booking}
    password: ${DATABASE_PASSWORD:booking_dev_password}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        batch_size: 100
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: notifications
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

  hold:
    ttl-seconds: ${HOLD_TTL_SECONDS:300}
    max-renewals: 1
    sweep-batch-size: 500
    sweep-interval-ms: 5000

  scheduling:
    enabled: true

  payment:
    recovery-min-age-seconds: 60
    recovery-batch-size: 50
    refund-max-attempts: 5
    webhook:
      secret: ${PAYMENT_WEBHOOK_SECRET}
      tolerance-seconds: 300

  idempotency:
    retention-hours: 24

  ledger:
    platform-fee-percent: 5.00

  outbox:
    topic: booking.events
    batch-size: 100
    lease-seconds: 30
    poll-interval-ms: 1000
    send-timeout-seconds: 10
    retention-days: 7

  kafka:
    consumer-enabled: true

logging:
  level:
    org.springframework.kafka: DEBUG
    org.springframework.kafka.listener: TRACE